# Replace the example address, host name and secret-file path.
# Omit this host definition if the proxy already has a Nagios host object.
define host {
    use                    linux-server
    host_name              mtproxy-example
    address                proxy.example.com
}

define service {
    use                    generic-service
    host_name              mtproxy-example
    service_description    MTProxy exchange
    check_command          check_mtproxy!/etc/nagios/mtproxy/proxy.secret
    check_period           24x7
    check_interval         3
    retry_interval         3
    max_check_attempts     3
}
